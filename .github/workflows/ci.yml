name: Firefox Extension CI

# Run on pushes to main and on all pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Lint code
  lint:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the code
    - uses: actions/checkout@v4
    
    # Set up Node.js (same version as your local environment)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    # Install dependencies
    - name: Install dependencies
      run: npm ci
    
    # Run linting
    - name: Lint code
      run: npm run lint