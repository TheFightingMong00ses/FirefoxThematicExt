name: Firefox Extension CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: Code Quality Checks
  # ============================================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting (Prettier)
        run: npm run format:check
        continue-on-error: false

      - name: Lint Firefox extension manifest
        run: npm run ext:lint
        continue-on-error: false

  # ============================================================
  # JOB 2: Run Tests
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality # Only run tests if code quality passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests
        run: npm test
        continue-on-error: false

    # Uncomment when you add test coverage
    # - name: Run tests with coverage
    #   run: npm run test:coverage

    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v4
    #   with:
    #     files: ./coverage/lcov.info
    #     fail_ci_if_error: false

  # ============================================================
  # JOB 3: Build Extension
  # ============================================================
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [code-quality, test] # Build only if quality and tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension package
        run: npx web-ext build --source-dir=. --artifacts-dir=dist

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/*.zip
          retention-days: 30

  # ============================================================
  # JOB 4: Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true # Don't fail CI on audit issues

      - name: Check for outdated dependencies
        run: npm outdated
        continue-on-error: true

  # ============================================================
  # JOB 5: Deploy (Only on main branch)
  # ============================================================
  deploy:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [code-quality, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npx web-ext build --source-dir=. --artifacts-dir=dist

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

    # Uncomment when you're ready to create releases
    # - name: Create Release
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     tag_name: v${{ steps.version.outputs.version }}
    #     name: Release v${{ steps.version.outputs.version }}
    #     files: dist/*.zip
    #     draft: false
    #     prerelease: false
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

